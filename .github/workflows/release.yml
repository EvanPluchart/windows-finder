name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/WindowsFinder.exe dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "WindowsFinder-${{ github.ref_name }}-windows-x64.zip"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (gh release view "${{ github.ref_name }}" 2>$null)) { gh release create "${{ github.ref_name }}" "WindowsFinder-${{ github.ref_name }}-windows-x64.zip" --title "Windows Finder ${{ github.ref_name }}" --generate-notes }
