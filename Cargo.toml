[package]
name = "winfinder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "WindowsFinder"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
csv = "1"
flume = "0.11"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_SystemServices", "Data_Pdf", "Media_Playback", "Media_Core", "Media", "Graphics_DirectX_Direct3D11", "Graphics_DirectX", "Graphics", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Storage", "Storage_Streams", "Foundation", "Win32_System_WinRT", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_UI_Controls"] }

[build-dependencies]
embed-resource = "3"
